[package]
name = "kart-auditor"
version = "0.1.0"
edition.workspace = true
description = "Visual audit report generator for KartRider pipeline outputs"

[[bin]]
name = "kart-audit"
path = "src/main.rs"

[dependencies]
kart-fmt = { path = "../kart-fmt" }
kart-render = { path = "../kart-render" }
glam = "0.29"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
