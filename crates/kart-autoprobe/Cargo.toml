[package]
name = "kart-autoprobe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kart-autoprobe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
kart-fmt = { path = "../kart-fmt" }
kart-rho = { path = "../kart-rho" }
kart-track-world = { path = "../kart-track-world" }

[lints]
workspace = true
