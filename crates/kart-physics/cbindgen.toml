    "SPECIAL_TRIGGER_COOLDOWN_MS",
    "STATE6_CONTACT_CONFIRM_MS",
    "MILLISECONDS_TO_SECONDS_F32",
    "INITIAL_BEST_DISTANCE_SQUARED",
    "NORMAL_SCALE",
    "NORMAL_DOT_THRESHOLD",
    "MIN_SEGMENT_LENGTH",
    "OPTIONAL_SPEED_THRESHOLD",
    "OPTIONAL_PHASE_GAIN",
    "OPTIONAL_ANGULAR_CUBIC_GAIN",
    "OPTIONAL_ANGULAR_BASE",
