# cbindgen 0.29 `export.include` does not filter constants, so every
# non-ABI pub const in the crate must be excluded by name. The verify
# script (scripts/verify_kart_physics_ffi_smoke.py) asserts that every
# `#define` in the generated header starts with KP_, so a future pub const
# that leaks past this list fails loudly there.
exclude = [
    "BANANA_EFFECT_DURATION_MS",
    "CURRENT_MANAGER_CAPACITY",
    "CURRENT_MANAGER_EMPTY_ITEM_ID",
    "NORMAL_STATE_DECAY_STEP",
    "PROJECTION_THRESHOLD",
    "STATE_DECAY_STEP",
    "SEQUENCE_BITS",
    "STATIC_ORIENTATION_SCALAR",
    "STATIC_STATE2_THRESHOLD_CONSTANT",
    "STATE1_CONTACT_DELAY_MS",
