    "KP_DOMAIN_NET_CORRECTION",
    "KpString64",
    "KpJsonBlob",
    "KpTopologyState",
    "KpRailSelectorRuntime",
    "KpRailCaptureLatch",
    "KpMovingContactAnchor",
    "KpRigidStateSnapshot",
    "KpNetworkCorrectionState",
    "KpVehicleState",
    "KpBoostParameters",
    "KpVehicleParameters",
    "KpInputs",
    "KpWorldGroundResult",
    "KpWorldObbOverlap",
    "KpTakeoffLandingContact",
    "KpCheckpointTargetCandidate",
    "KpCheckpointRespawnCandidate",
    "KpJsonScalar",
    "KpRailEntryBoundaryMatch",
    "KpQueryGroundFn",
    "KpSweepObbRotatingAllFn",
    "KpSweepObbRotatingFn",
    "KpOverlapObbAllFn",
    "KpQueryTakeoffLandingContactFn",
    "KpQueryCheckpointTargetCandidateFn",
    "KpQueryCheckpointRespawnFn",
    "KpSweepPointFn",
    "KpQueryRailContactFn",
    "KpQueryRailEntryBoundaryFn",
    "KpRailContextListFn",
    "KpQueryMovingContactFn",
    "KpQueryNetworkCorrectionFn",
