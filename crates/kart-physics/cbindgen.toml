# cbindgen configuration for the frozen kart-physics C ABI (milestone M4).
# Regenerate after any src/ffi.rs change:
#   cd rust/crates/kart-physics
#   cbindgen --config cbindgen.toml --crate kart-physics --output include/kart_physics.h
# The generated header is checked in at include/kart_physics.h; layout drift
# is caught by ffi::tests::layout_is_stable.

language = "C"
include_guard = "KART_PHYSICS_H"
usize_is_size_t = true
style = "both"
header = """
/* kart-physics frozen C ABI (milestone M4).
 *
 * GENERATED by cbindgen 0.29.4 from src/ffi.rs -- do not edit by hand.
 * Regenerate:
 *   cd rust/crates/kart-physics
 *   cbindgen --config cbindgen.toml --crate kart-physics --output include/kart_physics.h
 *
 * Conventions (see src/ffi.rs module docs for the full contract):
 * - Status codes: KP_OK / KP_ERR_*; thread-local detail via
 *   kart_physics_last_error_message.
 * - bools are uint8_t; Option<T> is a has_* presence tag plus payload.
 * - Strings are KpString64 (len + 64 inline bytes, no NUL required);
 *   longer strings are rejected, never truncated.
 * - Open JSON payloads (rail_capture_latch.selector, respawn
 *   course_context_id) cross as KpJsonBlob.
 * - World capabilities: NULL function pointer = capability absent,
 *   preserving the Python hasattr() semantics.
 * - ABI handshake: current hosts MUST create engines with
 *   kart_physics_create_v2(..., KP_ABI_VERSION) (refused with
 *   KP_ERR_ABI_VERSION on mismatch), and use the versioned state/parameter
 *   default writers. Plain kart_physics_create plus the unsuffixed default
 *   writers are the frozen v1 compatibility surface: state, parameters,
 *   and vtable access is bounded by KP_VEHICLE_STATE_V1_BYTES,
 *   KP_VEHICLE_PARAMETERS_V1_BYTES, and KP_WORLD_VTABLE_V1_BYTES.
 */"""
includes = []
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[defines]
"feature = serde" = "KART_PHYSICS_FEATURE_SERDE"

[export]
# The frozen ABI surface is exactly the Kp*/KP_*/kart_physics_* items in
# src/ffi.rs; keep every other pub item of the crate out of the header.
include = [
    "KP_ABI_VERSION",
    "KP_OK",
    "KP_ERR_NULL",
    "KP_ERR_INVALID_STATE",
    "KP_ERR_INVALID_PARAMS",
    "KP_ERR_INVALID_INPUT",
    "KP_ERR_STRING_TOO_LONG",
    "KP_ERR_JSON",
    "KP_ERR_STEP",
    "KP_ERR_PANIC",
    "KP_ERR_ABI_VERSION",
    "KP_STRING_CAPACITY",
    "KP_JSON_CAPACITY",
    "KP_VEHICLE_STATE_V1_BYTES",
    "KP_VEHICLE_STATE_V2_BYTES",
    "KP_VEHICLE_PARAMETERS_V1_BYTES",
    "KP_VEHICLE_STATE_V3_BYTES",
    "KP_VEHICLE_PARAMETERS_V3_BYTES",
    "KP_WORLD_VTABLE_V1_BYTES",
    "KP_KEY_UP",
    "KP_KEY_DOWN",
    "KP_KEY_LEFT",
    "KP_KEY_RIGHT",
    "KP_KEY_R",
    "KP_KEY_CTRL",
    "KP_KEY_ITEM_USE",
    "KP_KEY_MASK_ALL",
    "KP_NUMERIC_MODE_FLOAT32",
    "KP_NUMERIC_MODE_FLOAT64",
    "KP_JSON_SCALAR_NULL",
    "KP_JSON_SCALAR_BOOL",
    "KP_JSON_SCALAR_NUMBER",
    "KP_JSON_SCALAR_STRING",
    "KP_DOMAIN_GND",
    "KP_DOMAIN_GND_SLIP",
    "KP_DOMAIN_CONTACT",
    "KP_DOMAIN_AIR_ENTRY",
    "KP_DOMAIN_AIR",
    "KP_DOMAIN_LAND",
    "KP_DOMAIN_RAIL",
    "KP_DOMAIN_MOVING_CONTACT",
