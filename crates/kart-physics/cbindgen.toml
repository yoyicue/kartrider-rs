    "AUTHORED_TRIGGER_COOLDOWN_MS",
    "RAIL_CAPTURE_POSITION_GAIN_PER_SECOND",
    "RAIL_STATE6_ENTRY_FORCE_SCALE",
    "STATE6_PARTIAL_WHEEL_BRIDGE_DELTA_Z",
    "PREDICTION_HISTORY_LIMIT",
    "MAX_FRAME_DELTA_MS",
    "MAX_PHYSICS_SUBSTEP_MS",
    "DEFAULT_COLLISION_ARG_THRESHOLD",
    "KNOWN_SUBSTEPS",
    "RECORD_CTOR_DEFAULT",
]
