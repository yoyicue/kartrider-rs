[package]
name = "kart-rho"
version = "0.1.0"
edition.workspace = true
description = "Clean-room reader for KartRider .rho/.rho5 archives (decrypt + unpack)"

# The `kart-unpack` tool is auto-detected from src/bin/ (bin name = file stem),
# matching the src/bin convention the other crates' shippable tools use.

[dependencies]
miniz_oxide = "0.8"   # pure-Rust zlib inflate (wasm-friendly)

[lints]
workspace = true
