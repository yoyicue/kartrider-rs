[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Workspace task harness: cross-validation against local references and
# modern-client smoke checks.
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
kart-fmt = { path = "../crates/kart-fmt" }
kart-gltf = { path = "../crates/kart-gltf" }
kart-rho = { path = "../crates/kart-rho" }
serde_json = "1"
png = "0.17"

[lints]
workspace = true
